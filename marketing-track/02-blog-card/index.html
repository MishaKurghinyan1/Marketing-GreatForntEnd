<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Tailwind CDN allows you to use Tailwind classes immediately in your HTML without any installation steps. 
      If you're not using Tailwind, you may delete the <script> -->
    <!-- Get started on Tailwind: https://tailwindcss.com/docs/installation/play-cdn -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" href="img/favicon.ico" sizes="any" />
    <style>
      /* You may write styles inside this <style> tag or within `css/style.css`. */
    </style>
  </head>
  <body class="bg-gradient-to-br from-[#F9FAFB] to-[#D2D6DB]">
    <!-- Add your site or application content here -->
    <article
      class="shadow mt-[120px] flex flex-col w-[340px] h-fit mx-auto bg-white rounded-lg overflow-hidden"
    >
      <img
        class="self-stretch h-72 object-cover"
        src="./img/spacejoy-YqFz7UMm8qE-unsplash.jpg"
        alt="Modern living room interior with vibrant furniture"
      />
      <div class="flex flex-col flex-1 gap-3 px-4 py-6">
        <div class="flex flex-col flex-1 gap-2">
          <div class="flex flex-col flex-1 gap-2">
            <span
              class="bg-green-50 w-fit border border-green-200 rounded-full text-sm text-green-700 px-2 py-0.5"
              >Interior</span
            >
            <h2 class="text-lg font-semibold text-black">
              Top 5 Living Room Inspirations
            </h2>
          </div>
        </div>

        <div class="flex flex-col flex-1 gap-6">
          <p class="text-base font-medium flex-1 text-neutral-600">
            Curated vibrants colors for your living, make it pop & calm in the
            same time.
          </p>
          <a
            href="#"
            class="w-fit flex justify-center items-center gap-1.5 text-indigo-700 text-base font-medium hover:text-indigo-800 font-medium rounded-lg focus:outline-none focus:ring-4 focus:ring-indigo-700/12 disabled:text-neutral-400"
          >
            <span class="px-0.5">Read more</span>
            <div class="flex items-center w-[20px] h-[20px]">
              <svg
                width="14"
                height="13"
                viewBox="0 0 14 13"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M10.143 5.64852L5.673 1.17851L6.8515 0L13.3333 6.48185L6.8515 12.9636L5.673 11.7851L10.143 7.31518H0V5.64852H10.143Z"
                  fill="currentColor"
                />
              </svg>
            </div>
          </a>
        </div>
      </div>
    </article>
    <!-- Interior
      
      
      Read more -->

    <!-- Attribute this challenge to yourself! -->
    <div class="credits" data-gfe-screenshot-exclude="true">
      A challenge by
      <a
        href="https://www.greatfrontend.com/projects?ref=challenges"
        target="_blank"
        >GreatFrontEnd Projects</a
      >. Built by
      <a
        href="https://www.greatfrontend.com/projects/u/username"
        target="_blank"
        >Your Name</a
      >.
    </div>
    <script src="js/index.js"></script>
  </body>
</html>
