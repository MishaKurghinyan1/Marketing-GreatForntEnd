      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"

    <!-- Tailwind CDN allows you to use Tailwind classes immediately in your HTML without any installation steps. 
      If you're not using Tailwind, you may delete the <script> -->

  <body class="bg-gradient-to-br from-[#F9FAFB] to-[#D2D6DB]">
    <!-- Add your site or application content here -->
    <article
      class="shadow mt-[120px] card flex flex-col w-[340px] h-fit mx-auto bg-white rounded-lg overflow-hidden"
    >
      <img
        class="self-stretch h-72 object-cover"
        src="./img/spacejoy-YqFz7UMm8qE-unsplash.jpg"
        alt="Modern living room with vibrant colors and minimalist design"
      />

      <div class="flex flex-col flex-1 gap-3 px-[16px] py-[24px]">
        <div class="flex flex-col flex-1 gap-[8px]">
          <span
            class="bg-green-50 w-fit border border-green-200 rounded-full text-sm text-green-700 font-normal px-[8px] py-[2px]"
          >
            Interior
          </span>
          <h2 class="text-lg text-black font-semibold">
            Top 5 Living Room Inspirations
          </h2>
        </div>

        <p class="text-base text-neutral-600 font-medium">
          Curated vibrant colors for your living, make it pop & calm at the same
          time.
        </p>

        <a
          href="#"
          class="inline-flex items-center gap-[6px] w-fit text-indigo-700 text-base font-medium hover:text-indigo-800 rounded-lg focus:outline-none focus:ring-4 focus:ring-indigo-700/12"
        >
          <span class="px-[2px] text-base font-medium">Read more</span>
          <div class="flex w-[20px] h-[20px] items-center">
            <svg
              width="14"
              height="13"
              viewBox="0 0 14 13"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M10.143 5.64852L5.673 1.17851L6.8515 0L13.3333 6.48185L6.8515 12.9636L5.673 11.7851L10.143 7.31518H0V5.64852H10.143Z"
                fill="currentColor"
              />
            </svg>
          </div>
        </a>
      </div>
    </article>
